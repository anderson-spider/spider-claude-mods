name: ci

on:
  # `edited` runs the checks again when the title changes: the release rules read it.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Marketplace and plugin manifests agree
        run: node scripts/check-consistency.mjs
      - name: No plugin version edited by hand, and a title that releases what changed
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          RELEASE_BOT: ${{ vars.RELEASE_BOT }}
        run: node scripts/check-release.mjs "origin/${{ github.base_ref }}"
      - name: Script and hook tests
        run: node --test scripts/*.test.mjs
      - name: codex computer use helper tests
        run: node --test plugins/codex/helper/test/*.test.mjs

  # The same tasks as `npm run check` (scripts/tasks/), which pick the tools from node_modules and run every plugin, the
  # unlisted ones included, then fail naming what failed. No task logs in. The pinned row, with the CLI package.json
  # pins, is the `plugins` check; the latest row shows early what a newer CLI breaks and never fails the run.
  plugins:
    name: ${{ matrix.cli == 'latest' && 'plugins-latest' || 'plugins' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.cli == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        cli: [pinned, latest]
    env:
      CLI: ${{ matrix.cli }}
      DISABLE_AUTOUPDATER: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm ci installs the pinned CLI and TypeScript; the latest row swaps in the newest CLI without touching the lockfile.
      - name: Install Claude Code and TypeScript
        run: |
          npm ci
          [ "$CLI" = latest ] && npm install --no-save @anthropic-ai/claude-code@latest
          node_modules/.bin/claude --version
      - name: Validate the marketplace and every plugin
        run: npm run plugins:validate
      - name: Test the scripts and every plugin
        run: npm run plugins:test
      # The scaffold runs in a copy so the checkout stays clean.
      - name: Scaffold a sample plugin and check it
        run: |
          cp -R . "$RUNNER_TEMP/scaffold"
          cd "$RUNNER_TEMP/scaffold"
          node scripts/new-plugin.mjs ci-sample "CI sample plugin."
          npm run plugins:validate -- ci-sample
          npm run plugins:test -- ci-sample
      # typecheck generates the typings first, in an interactive session. A fresh runner has no login: onboarding and
      # folder trust are marked done so the session starts and loads every plugin of the scaffold copy, ci-sample included.
      - name: Type-check every plugin and the sample
        working-directory: ${{ runner.temp }}/scaffold
        run: |
          node -e 'require("fs").writeFileSync(require("os").homedir() + "/.claude.json", JSON.stringify({ hasCompletedOnboarding: true, theme: "dark", projects: { [process.cwd()]: { hasTrustDialogAccepted: true } } }))'
          npm run typecheck

  # A new user's install on a clean Linux machine: bootstrap.sh from this checkout, then every plugin loads in a session
  # without login (scripts/install-test/).
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the marketplace on a clean machine
        run: bash scripts/tasks/install-test.sh
